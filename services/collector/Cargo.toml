[package]
name = "kurzhaar-collector"
description = "Accepts tracker batches and writes them to the queue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kurzhaar_collector"
path = "src/lib.rs"

[[bin]]
name = "collector"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
axum = "0.8"
blake3 = "1"
getrandom = "0.3"
hmac = "0.12"
ipnet = "2"
kurzhaar-core = { path = "../../crates/core" }
kurzhaar-protocol = { path = "../../crates/protocol" }
kurzhaar-queue = { path = "../../crates/queue" }
maxminddb = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
zeroize = "1"


[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
