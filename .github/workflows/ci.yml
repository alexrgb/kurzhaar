name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OXISPEC_VERSION: 0.1.0-rc.5

jobs:
  specs:
    name: Specs (oxispec check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install oxispec
        run: |
          base="https://github.com/alexrgb/oxispec/releases/download/v${OXISPEC_VERSION}"
          file="oxispec-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/$file.sha256"
          sha256sum -c "$file.sha256"
          mkdir -p "$HOME/oxispec"
          tar -xJf "$file" -C "$HOME/oxispec" --strip-components=1
          echo "$HOME/oxispec" >> "$GITHUB_PATH"
      - run: oxispec check

  js:
    name: JavaScript (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: No JavaScript sources (REQ-TRACKER-2D61)
        run: |
          files=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx')
          if [ -n "$files" ]; then
            echo "JavaScript sources are not allowed, write TypeScript (ADR-03W7):"
            echo "$files"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KURZHAAR_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  swift:
    name: Swift (build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build

  compose:
    name: Compose (config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every profile
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          for profiles in minimal full,queue-redis full,queue-kafka full,queue-rabbitmq; do
            echo "== $profiles"
            COMPOSE_PROFILES="$profiles" docker compose config --quiet
          done

  golden:
    name: Golden dataset (ClickHouse)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kurzhaar/schema test
